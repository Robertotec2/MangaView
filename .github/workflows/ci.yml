name: CI

# Se ejecuta en cada push a cualquier rama y en cada pull request, para que
# ninguna entrega llegue sin haber pasado las pruebas.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pruebas:
    name: Pruebas unitarias del backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      # Si una version de Node falla, interesa ver el resultado de las demas.
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci instala exactamente las versiones del package-lock.json, para que
      # el pipeline pruebe el mismo arbol de dependencias en cada ejecucion.
      - name: Instalar dependencias
        run: npm ci

      - name: Verificar que todos los modulos son sintacticamente validos
        run: |
          for archivo in $(find src -name '*.js'); do
            node --check "$archivo"
          done

      - name: Ejecutar las pruebas unitarias
        run: npm test
