# Blueprint de Render: Web Service + PostgreSQL (plan free).
# Deploy: https://render.com/deploy?repo=https://github.com/Robertotec2/MangaView

databases:
  - name: mangaview-db
    plan: free

services:
  - type: web
    name: mangaview
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run db:setup && npm start
    healthCheckPath: /api
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: mangaview-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "10"
